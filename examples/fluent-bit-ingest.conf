# Fluent Bit → slowlog-ai ingest webhook（示例片段）
# 需 HTTP Output 插件；与 DaemonSet / Sidecar 采集 MySQL 慢日志配合使用。
#
# 环境：agent-api 监听 SLOWLOG_API_ADDR，并配置 SLOWLOG_WEBHOOK_SECRET（可选）

[SERVICE]
    Flush        1
    Log_Level    info

[INPUT]
    Name              tail
    Path              /var/log/mysql/slow.log
    Tag               mysql.slow
    multiline.parser  slowlog_multiline

[FILTER]
    Name    grep
    Match   mysql.slow
    Regex   Query_time\s+[1-9][0-9]*\.|Query_time\s+[2-9]\.

[OUTPUT]
    Name                 http
    Match                mysql.slow
    Host                 agent-api.default.svc.cluster.local
    Port                 8080
    URI                  /v1/ingest
    Format               json
    Json_date_key        false
    Header               Content-Type application/json
    Header               X-Webhook-Secret ${SLOWLOG_WEBHOOK_SECRET}
    json_key_name        slow_log
    # 将整条日志行作为 slow_log 字段；若插件不支持 json_key_name，改用 lua 组装：
    # {"slow_log":"<escaped log>","source":"fluent-bit","async":true}
